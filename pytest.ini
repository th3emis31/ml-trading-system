[pytest]
# Only the real tests folder is collected. Without this, a bare `python -m pytest` also walks
# _backups/snapshot_code_20260914/, whose tests/ carries the same module basenames (import file
# mismatch) and whose older trading/mt4_service.py gets imported first, so MT4Service loses its
# expected_account argument and every test that imports app.py fails to collect. The System Doctor
# never saw this because it passes an explicit file list; the documented command did.
testpaths = tests
norecursedirs = _backups .claude .git __pycache__ data logs models node_modules venv .venv
